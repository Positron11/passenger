<!DOCTYPE html>

<html lang="en">
<head>
	<!-- site meta -->
	<meta charset="UTF-8">
	<meta name="author" content="Aarush Kumbhakern">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Passenger</title>

	<!-- styles -->
	<link rel="stylesheet" href="css/hegel/hegel.css">
	<link rel="stylesheet" href="css/main.css">

	<!-- scripts -->
	<script type="module" src="js/main.js" defer></script>
</head>

<body>
	<div id="Page" class="Flexbox mCol mDblSpacing">
		<header>
			<h1>Passenger</h1>
			<p>Local PBKDF2 + ByteWords password gen. and manager.</p>
		</header>

		<div class="Flexbox mCol mStdSpacing">
			<div class="Flexbox mCmpSpacing mVAlignCenter">
				<hr>
				
				<label class="Toggle iJustifyLeft">
					Auto-Copy
					<input type="checkbox" name="Auto-Copy" id="AutoCopy">
				</label>
			</div>
			
			<main>			
				<table>
					<tr>
						<td><label for="Passkey">Passkey</label></td>
						<td><input type="password" name="passkey" id="Passkey" autofocus></td>
					</tr>
					
					<tr>
						<td><label for="Application">Use Case</label></td>
						<td><input type="text" name="application" id="Application" placeholder="eg. google:martha2011" spellcheck="false"></td>
					</tr>
				</table>
			</main>
			
			<div class="Flexbox mCmpSpacing">
				<code id="Canvas" class="iGrow" aria-live="polite"></code>
				<button id="Copy">Copy</button>
			</div>	
		</div>
		
		<hr>

		<footer>
			<p class="tGray"><small>Aarush Kumbhakern &copy; <span id="Year"></span> | <a href="https://github.com/Positron11/passenger" target="_blank">Source & docs</a>.</small></p>
			
			<!-- auto-updating year script -->
			<script>document.getElementById("Year").textContent = new Date().getFullYear();</script>
		</footer>
	</div>
</body>
</html>
